name: Deploy to Raspberry Pi

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - QA
          - PROD
      run_id:
        description: 'CI workflow run ID to deploy (leave blank for latest)'
        required: false
        type: string

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: [self-hosted, linux, ARM64]
    environment: ${{ inputs.environment }}

    steps:
      - name: Set deploy config
        id: cfg
        run: |
          echo "deploy_dir=${{ vars.DEPLOY_PATH }}" >> $GITHUB_OUTPUT
          echo "project=homegate-$(echo '${{ inputs.environment }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          if [ "${{ inputs.environment }}" = "PROD" ]; then
            echo "compose=docker-compose.prod.yml" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.environment }}" = "QA" ]; then
            echo "compose=docker-compose.qa.yml" >> $GITHUB_OUTPUT
          else
            echo "Unknown environment: ${{ inputs.environment }}" >&2
            exit 1
          fi

      - name: Resolve CI run ID
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            echo "run_id=${{ inputs.run_id }}" >> $GITHUB_OUTPUT
          else
            RUN_ID=$(gh run list --workflow=ci.yml --status=success --limit=1 --json databaseId -q '.[0].databaseId')
            echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          fi

      - name: Stop existing containers
        run: |
          DEPLOY=${{ steps.cfg.outputs.deploy_dir }}
          COMPOSE=${{ steps.cfg.outputs.compose }}
          if [ -f "$DEPLOY/$COMPOSE" ]; then
            docker compose -p ${{ steps.cfg.outputs.project }} -f "$DEPLOY/$COMPOSE" down --remove-orphans || true
          fi

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOY=${{ steps.cfg.outputs.deploy_dir }}
          COMPOSE=${{ steps.cfg.outputs.compose }}
          RUN=${{ steps.resolve.outputs.run_id }}
          STAGING="$DEPLOY/.staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          # Deployment files (Dockerfile, compose, package.json, prisma) → staging first
          gh run download "$RUN" --pattern 'deployment-files-*' --dir "$STAGING"
          mv "$STAGING"/deployment-files-*/* "$STAGING"/ 2>/dev/null || true
          rmdir "$STAGING"/deployment-files-* 2>/dev/null || true

          # Copy everything except the compose file into deploy dir
          mkdir -p "$DEPLOY"
          find "$STAGING" -maxdepth 1 -not -name "$COMPOSE" -not -path "$STAGING" -exec cp -r {} "$DEPLOY"/ \;

          # Server build
          mkdir -p "$DEPLOY/server/dist"
          gh run download "$RUN" --pattern 'server-build-*' --dir "$DEPLOY/server/dist"
          mv "$DEPLOY"/server/dist/server-build-*/* "$DEPLOY/server/dist/" 2>/dev/null || true
          rmdir "$DEPLOY"/server/dist/server-build-* 2>/dev/null || true

          # Client build
          mkdir -p "$DEPLOY/client/out"
          gh run download "$RUN" --pattern 'client-build-*' --dir "$DEPLOY/client/out"
          mv "$DEPLOY"/client/out/client-build-*/* "$DEPLOY/client/out/" 2>/dev/null || true
          rmdir "$DEPLOY"/client/out/client-build-* 2>/dev/null || true

      - name: Create .env for compose
        working-directory: ${{ steps.cfg.outputs.deploy_dir }}
        run: |
          cat > .env <<'EOF'
          PORT=${{ vars.PORT }}
          DOMAIN=${{ vars.DOMAIN }}
          APP_SUBDOMAIN=${{ vars.APP_SUBDOMAIN }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          POSTGRES_USER=${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ vars.POSTGRES_DB }}
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Build image
        working-directory: ${{ steps.cfg.outputs.deploy_dir }}
        run: |
          COMPOSE=${{ steps.cfg.outputs.compose }}
          docker compose -p ${{ steps.cfg.outputs.project }} -f ".staging/$COMPOSE" build --no-cache server

      - name: Deploy containers
        working-directory: ${{ steps.cfg.outputs.deploy_dir }}
        run: |
          COMPOSE=${{ steps.cfg.outputs.compose }}
          # Promote compose only after a successful build
          mv ".staging/$COMPOSE" "$COMPOSE"
          docker compose -p ${{ steps.cfg.outputs.project }} -f "$COMPOSE" up -d

      - name: Wait for healthy
        run: |
          echo "Waiting for server to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:${{ vars.PORT }}/api/health > /dev/null 2>&1; then
              echo "Server is healthy!"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy in time"
          docker compose -p ${{ steps.cfg.outputs.project }} -f ${{ steps.cfg.outputs.deploy_dir }}/${{ steps.cfg.outputs.compose }} logs server --tail=50
          exit 1

      - name: Cleanup
        if: always()
        run: |
          rm -rf "${{ steps.cfg.outputs.deploy_dir }}/.staging"
          docker image prune -f
