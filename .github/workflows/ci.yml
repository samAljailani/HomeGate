name: Development CI

on:
    push:
        branches: [development]
    pull_request:
        branches: [development]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: '22'

jobs:
    validate:
        name: Validate
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  registry-url: https://npm.pkg.github.com

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # TODO: re-enable after fixing prettier plugin compatibility
            # - name: Check formatting (root & packages)
            #   run: npx prettier --check "*.{json,md,yml,yaml}" ".github/**" "packages/**"

            # - name: Check formatting (server)
            #   working-directory: server
            #   run: npm run format:check

            # - name: Check formatting (client)
            #   working-directory: client
            #   run: npm run format:check

            - name: Lint server
              working-directory: server
              run: npx eslint "{src,test}/**/*.ts"

            - name: Lint client
              working-directory: client
              run: npm run lint

            - name: Generate Prisma client
              working-directory: server
              run: npx prisma generate

            - name: Build types package
              run: npm --workspace packages/types run build:ci

            - name: Typecheck server
              working-directory: server
              run: npx tsc --noEmit

            - name: Typecheck client
              working-directory: client
              run: npx tsc --noEmit

            - name: Audit dependencies
              run: npm audit --audit-level=high
              continue-on-error: true

    prisma:
        name: Validate Prisma
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  registry-url: https://npm.pkg.github.com

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Validate Prisma schema
              working-directory: server
              run: npx prisma validate

            - name: Generate Prisma client
              working-directory: server
              run: npx prisma generate

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [validate, prisma]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  registry-url: https://npm.pkg.github.com

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate Prisma client
              working-directory: server
              run: npx prisma generate

            - name: Build types package
              run: npm --workspace packages/types run build:ci

            - name: Build server
              run: npm run build:server

            - name: Build client
              run: npm run build:client

            - name: Upload server artifact
              uses: actions/upload-artifact@v4
              with:
                  name: server-build
                  path: server/dist
                  retention-days: 7

            - name: Upload client artifact
              uses: actions/upload-artifact@v4
              with:
                  name: client-build
                  path: client/out
                  retention-days: 7

    test:
        name: Test
        runs-on: ubuntu-latest
        needs: [validate, prisma, build]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  registry-url: https://npm.pkg.github.com

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate Prisma client
              working-directory: server
              run: npx prisma generate

            - name: Build types package
              run: npm --workspace packages/types run build:ci

            - name: Run unit tests
              working-directory: server
              run: npm run test:cov -- --ci

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: server/coverage/
                  retention-days: 14
