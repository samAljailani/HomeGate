services:
  server:
    container_name: homegate-server
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        PORT: ${PORT:-3003}
    restart: unless-stopped
    environment:
      APP_ENV: production
      TZ: America/New_York
      PORT: ${PORT:-3003}
      HOST: https://${APP_SUBDOMAIN}.${DOMAIN}
      CLIENT_RELATIVE_STATIC_PATH: ./dist/client/
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-HOMEGATE_SID}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-.${DOMAIN}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      LOG_TARGETS: console,database
      LOG_LEVEL: debug
      LOG_FORMAT: console
      COLOR_LOGS: "false"
    ports:
      - "${PORT:-3003}:${PORT:-3003}"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homegate.entrypoints=websecure"
      - "traefik.http.routers.homegate.rule=Host(`${APP_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.homegate.tls.certresolver=sslresolver"
      - "traefik.http.services.homegate.loadbalancer.server.port=${PORT:-3003}"
      # ForwardAuth middleware — other services reference this as homegate-forward-auth@docker
      - "traefik.http.middlewares.homegate-forward-auth.forwardauth.address=http://homegate-server:${PORT:-3003}/api/auth/forward"
      - "traefik.http.middlewares.homegate-forward-auth.forwardauth.trustForwardHeader=true"
    networks:
      - traefik

  db:
    container_name: homegate-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-HomeGate}
      TZ: America/New_York
      PGTZ: America/New_York
    command: ["postgres", "-c", "timezone=America/New_York"]
    volumes:
      - homegate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks:
      - traefik
  adminer:
    container_name: homegate-prod-adminer
    image: adminer
    restart: always
    environment:
      TZ: America/New_York
    ports:
      - "8755:8080"
    depends_on:
      - db
    networks:
      - traefik
volumes:
  homegate-pgdata:

networks:
  traefik:
    external: true
    name: traefik_default
